name: Playwright Tests & Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Playwright HTML Report (Artifact)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Load Allure History
        uses: actions/checkout@v7
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@v1.15
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Post Allure Report Link to Jira Issue
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
        env:
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}  
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPORT_URL: "https://luke-codewalker-force.github.io/testing/"
        run: |
          # 1. Search for Jira issue key in commit message first, then in branch name
          ISSUE_KEY=$(echo "$COMMIT_MSG $GITHUB_REF_NAME" | grep -oE '[A-Z]+-[0-9]+' | head -n 1)

          # 2. Skip if no Jira key is found
          if [ -z "$ISSUE_KEY" ]; then
            echo "No Jira issue key detected in commit message or branch name. Skipping Jira comment."
            exit 0
          fi

          echo "Posting report link to Jira issue: $ISSUE_KEY"

          # 3. Post comment to Jira issue via REST API
          curl --request POST \
            --url "${JIRA_URL}/rest/api/3/issue/${ISSUE_KEY}/comment" \
            --user "${JIRA_USER}:${JIRA_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Automated tests finished. View latest Allure Report: "
                      },
                      {
                        "type": "text",
                        "text": "'"${REPORT_URL}"'",
                        "marks": [
                          {
                            "type": "link",
                            "attrs": {
                              "href": "'"${REPORT_URL}"'"
                            }
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            }'